basePath: /
definitions:
  IRIS-Server_internal_models.BaseTracker:
    properties:
      battery:
        type: integer
      id:
        type: string
      lastUpdate:
        type: string
      name:
        type: string
      position:
        $ref: '#/definitions/IRIS-Server_internal_models.Position'
      resource:
        $ref: '#/definitions/IRIS-Server_internal_models.TableauResource'
    type: object
  IRIS-Server_internal_models.MCPConfig:
    properties:
      api_key:
        type: string
      delete_markers_on_unassign:
        type: boolean
      enabled:
        type: boolean
      operation_id:
        type: string
      sentNotEnabledWarning:
        description: internal flag to track if the "not enabled" warning has been
          logged
        type: boolean
      siteplan_id:
        type: string
      url:
        type: string
    type: object
  IRIS-Server_internal_models.MCPOperation:
    properties:
      active:
        type: boolean
      archived:
        type: boolean
      id:
        type: string
      place:
        $ref: '#/definitions/IRIS-Server_internal_models.MCPPlace'
      title:
        type: string
    type: object
  IRIS-Server_internal_models.MCPPlace:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  IRIS-Server_internal_models.MCPRun:
    properties:
      active:
        type: boolean
      address:
        type: string
      hasPatient:
        type: boolean
      id:
        type: string
      lat:
        type: number
      long:
        type: number
      obj:
        type: string
      operation:
        $ref: '#/definitions/IRIS-Server_internal_models.MCPOperation'
      place:
        type: string
    type: object
  IRIS-Server_internal_models.MCPSiteplan:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  IRIS-Server_internal_models.Position:
    properties:
      lat:
        type: number
      lon:
        type: number
    type: object
  IRIS-Server_internal_models.Resource:
    properties:
      id:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  IRIS-Server_internal_models.TableauResource:
    properties:
      id:
        type: string
      lat:
        type: number
      lon:
        type: number
      operationId:
        type: string
      resource:
        $ref: '#/definitions/IRIS-Server_internal_models.Resource'
      status:
        type: integer
    type: object
  internal_handlers.PositionRequest:
    properties:
      lat:
        type: number
      long:
        type: number
    type: object
host: 0.0.0.0:8080
info:
  contact: {}
  description: Tracker and MCP integration
  title: IRIS-Server
  version: "1.0"
paths:
  /chirpstackGateway/data:
    post:
      consumes:
      - application/json
      description: Receives uplink events from Chirpstack HTTP integration, parses
        tracker data, and updates database and MCP
      parameters:
      - description: Event type (must be 'up')
        in: query
        name: event
        required: true
        type: string
      - description: Chirpstack uplink event payload
        in: body
        name: payload
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Event processed successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Unsupported event type, invalid JSON, or missing DevEUI
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Database or MCP update error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Chirpstack webhook endpoint
      tags:
      - gateway
  /mcp/config:
    get:
      description: Returns the current MCP configuration (including sensitive data
        like full API key)
      produces:
      - application/json
      responses:
        "200":
          description: Current MCP configuration
          schema:
            properties:
              api_key:
                type: string
              enabled:
                type: boolean
              operation_id:
                type: string
              siteplan_id:
                type: string
              url:
                type: string
            type: object
        "500":
          description: Failed to fetch configuration
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get MCP configuration
      tags:
      - mcp
  /mcp/operations:
    get:
      description: Fetches all active operations from the MCP API
      produces:
      - application/json
      responses:
        "200":
          description: List of active operations
          schema:
            items:
              $ref: '#/definitions/IRIS-Server_internal_models.MCPOperation'
            type: array
        "500":
          description: Failed to fetch MCP operations
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get MCP operations
      tags:
      - mcp
  /mcp/operations/set/{id}:
    post:
      description: Validates and selects an operation from MCP. This operation will
        be used for subsequent siteplan selection.
      parameters:
      - description: Operation UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Operation selected successfully
        "400":
          description: Invalid operation ID or operation not found in MCP
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to save operation
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Select MCP operation
      tags:
      - mcp
  /mcp/siteplans:
    get:
      description: Fetches all siteplans for the currently selected operation from
        the MCP API
      produces:
      - application/json
      responses:
        "200":
          description: List of siteplans
          schema:
            items:
              $ref: '#/definitions/IRIS-Server_internal_models.MCPSiteplan'
            type: array
        "422":
          description: No place associated with selected operation
          schema:
            additionalProperties:
              type: string
            type: object
        "428":
          description: No operation selected
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to fetch siteplans or no operation selected
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get MCP siteplans
      tags:
      - mcp
  /mcp/siteplans/set/{id}:
    post:
      description: Validates and selects a siteplan from MCP. This siteplan will be
        used for marker operations.
      parameters:
      - description: Siteplan UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Siteplan selected successfully
        "400":
          description: Invalid siteplan ID or siteplan not found in MCP
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to save siteplan
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Select MCP siteplan
      tags:
      - mcp
  /mcp/start:
    post:
      consumes:
      - application/json
      description: Tests connection and saves MCP configuration (URL, API key, enabled
        state)
      parameters:
      - description: MCP configuration
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/IRIS-Server_internal_models.MCPConfig'
      responses:
        "200":
          description: MCP integration configured successfully
        "400":
          description: Invalid request or MCP server not reachable
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to save configuration
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Configure MCP integration
      tags:
      - mcp
  /resources/:
    get:
      description: Returns a list of all resources from the MCP system
      produces:
      - application/json
      responses:
        "200":
          description: List of Tableau resources
          schema:
            items:
              $ref: '#/definitions/IRIS-Server_internal_models.TableauResource'
            type: array
        "500":
          description: Failed to fetch resources
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all resources
      tags:
      - resources
  /resources/{resourceId}/position:
    put:
      consumes:
      - application/json
      description: Updates the position (longitude and latitude) of a specific resource
      parameters:
      - description: Resource ID
        in: path
        name: resourceId
        required: true
        type: string
      - description: Position data
        in: body
        name: position
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.PositionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Resource position updated successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to update resource position
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set resource position
      tags:
      - resources
  /runs/:
    get:
      description: Returns a list of all runs from the MCP system
      produces:
      - application/json
      responses:
        "200":
          description: List of MCP runs
          schema:
            items:
              $ref: '#/definitions/IRIS-Server_internal_models.MCPRun'
            type: array
        "500":
          description: Failed to fetch runs
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all runs
      tags:
      - runs
  /runs/{runId}/position:
    post:
      consumes:
      - application/json
      description: Sets the position of a specific run on the map.
      parameters:
      - description: Run ID
        in: path
        name: runId
        required: true
        type: string
      - description: Position data
        in: body
        name: position
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.PositionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Position set successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to set run position
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set run position
      tags:
      - runs
  /system/status:
    get:
      description: Returns system health information including database status, MCP
        connectivity, uptime, and active tracker count
      produces:
      - application/json
      responses:
        "200":
          description: System status information
          schema:
            properties:
              active-trackers:
                type: integer
              database:
                type: string
              mcp:
                type: string
              status:
                type: string
              uptime:
                type: string
            type: object
        "500":
          description: Failed to count active trackers
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get system status
      tags:
      - system
  /system/version:
    get:
      description: Returns the current version of the IRIS-Server application
      produces:
      - application/json
      responses:
        "200":
          description: Application version
          schema:
            properties:
              version:
                type: string
            type: object
      summary: Get application version
      tags:
      - system
  /tracker/:
    get:
      description: Returns a list of all trackers in the system with their current
        status, position, and assigned resources
      produces:
      - application/json
      responses:
        "200":
          description: List of trackers
          schema:
            items:
              $ref: '#/definitions/IRIS-Server_internal_models.BaseTracker'
            type: array
        "500":
          description: Failed to fetch trackers
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all trackers
      tags:
      - trackers
  /tracker/assign/{tracker_id}:
    post:
      description: Removes the resource assignment from a tracker
      parameters:
      - description: Tracker UUID
        in: path
        name: tracker_id
        required: true
        type: string
      responses:
        "200":
          description: Resource unassigned successfully
        "400":
          description: Invalid tracker ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Tracker not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to remove tracker resource assignment
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Unassign resource from tracker
      tags:
      - trackers
  /tracker/assign/{tracker_id}/{tableau_resource_id}:
    post:
      description: Assigns a resource to a tracker.
      parameters:
      - description: Tracker UUID
        in: path
        name: tracker_id
        required: true
        type: string
      - description: Tableau Resource UUID
        in: path
        name: tableau_resource_id
        required: true
        type: string
      responses:
        "200":
          description: Assignment updated successfully
        "400":
          description: Invalid tracker or tableau resource ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Tracker or tableau resource not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to update assignment
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Assign a resource to tracker
      tags:
      - trackers
  /tracker/rename/{tracker_id}:
    post:
      consumes:
      - application/json
      description: Updates the display name of a tracker
      parameters:
      - description: Tracker UUID
        in: path
        name: tracker_id
        required: true
        type: string
      - description: New tracker name
        in: body
        name: request
        required: true
        schema:
          properties:
            newName:
              type: string
          type: object
      responses:
        "200":
          description: Tracker renamed successfully
        "400":
          description: Invalid tracker ID or request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to rename tracker
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Rename a tracker
      tags:
      - trackers
swagger: "2.0"
